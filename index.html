<!DOCTYPE html>                                                                                 
<html>    
<head>          
    <title>CS50w - Google Search</title>            
    <link rel="stylesheet" href="styles.css">
</head>                     
<body>   
    
    <!-- Links at the top right -->
    <div class="nav-container">
        <a href="images.html" class="nav-link">Images</a>
        <a href="advanced.html" class="nav-link">Advanced Search</a>
    </div> 

    <!-- Google Logo -->
    <h1 class="logo">      
        <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>  
    </h1>        

    <!-- Search Form -->
    <form action="https://google.com" method="GET">
        
        <!-- Search Bar -->
        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" name="q" placeholder="Search In Google" autocomplete="off" class="search-input">
        </div>

        <!-- Buttons -->
        <div class="buttons-container">
            <input type="submit" value="Google Search" class="btn">
            <input type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">
        </div>

    </form>

</body>
</html>
